<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Sayang ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9ecf,#ffd6e8);
    overflow:hidden;
}

.container{
    text-align:center;
    color:white;
    z-index:2;
    animation:muncul 1.5s ease;
}

h1{
    font-size:42px;
    margin-bottom:15px;
    text-shadow:2px 2px 8px rgba(0,0,0,.2);
}

p{
    font-size:22px;
    margin-bottom:25px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    background:white;
    color:#ff4f93;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

#pesan{
    margin-top:25px;
    font-size:26px;
    display:none;
    animation:muncul 1s;
}

@keyframes muncul{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.heart{
    position:absolute;
    color:#ff3b7d;
    font-size:20px;
    animation:terbang 6s linear infinite;
}

@keyframes terbang{
    0%{
        transform:translateY(100vh) scale(0);
        opacity:1;
    }
    100%{
        transform:translateY(-120px) scale(1.5);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>❤️ Hai Sayang ❤️</h1>
    <p>Aku punya sesuatu buat kamu...</p>

    <button onclick="tampilPesan()">Klik di sini</button>

    <div id="pesan">
        💖 Maafin aku ya sayangg 💖<br><br>
        Aku benar-benar minta maaf. Semoga kamu mau memaafkan aku ya. ❤️🥺
    </div>
</div>

<script>
function tampilPesan(){
    document.getElementById("pesan").style.display="block";
}

function buatHati(){
    const hati=document.createElement("div");
    hati.classList.add("heart");
    hati.innerHTML="❤️";

    hati.style.left=Math.random()*100+"vw";
    hati.style.fontSize=(20+Math.random()*30)+"px";
    hati.style.animationDuration=(4+Math.random()*3)+"s";

    document.body.appendChild(hati);

    setTimeout(()=>{
        hati.remove();
    },7000);
}

setInterval(buatHati,300);
</script>

</body>
</html>
